<!doctype html>
<html lang="tr" data-theme="academic">
<head>
<meta charset="utf-8">
<title>ImageNet doğrusal değerlendirme</title>
<link rel="stylesheet" href="_base/tokens.css">
<link rel="stylesheet" href="_base/stage.css">
<style>
  svg.plot { position: absolute; left: 120px; top: 250px; width: 1680px; height: 740px; overflow: visible; }
  text { font-family: var(--font-sans); fill: var(--ink); dominant-baseline: central; }
  text.m { font-size: 32px; font-weight: 650; }
  text.a { font-size: 28px; fill: var(--ink-2); }
  text.g { font-size: 28px; fill: var(--accent); font-style: italic; letter-spacing: .02em; }
  text.v { font-size: 30px; font-weight: 700; }
  text.tick { font-size: 28px; fill: var(--muted); text-anchor: middle; }
  text.ax { font-size: 28px; fill: var(--ink-2); text-anchor: middle; }
  line.grid { stroke: var(--line); stroke-width: 2; }
  line.row { stroke: var(--line); stroke-width: 2; stroke-dasharray: 3 7; }
  circle.dot { fill: var(--muted); }
  circle.me { fill: var(--accent); }
  .call { font-size: 30px; fill: var(--accent); font-weight: 650; }
</style>
</head>
<body data-hold="3.5">
<div class="pm-stage">
  <div class="pm-eyebrow" id="eyebrow"></div>
  <h2 class="pm-h2" id="title"></h2>
  <svg class="plot" id="plot" viewBox="0 0 1680 740"></svg>
  <div class="pm-source" id="source"></div>
</div>

<script type="application/json" id="pm-data">
{
  "eyebrow": "Bulgular · ImageNet-1K",
  "title": "Veri artırma olmadan, artırma kullananlarla aynı düzey",
  "axis": { "min": 76, "max": 82, "step": 1, "label": "Top-1 doğruluk (%) · doğrusal değerlendirme" },
  "groups": [
    { "name": "Veri artırma kullanmayanlar", "rows": [
      { "m": "data2vec", "a": "ViT-L/16 · 1600 ep", "v": 77.3 },
      { "m": "MAE", "a": "ViT-H/14 · 1600 ep", "v": 77.2 },
      { "m": "CAE", "a": "ViT-L/16 · 1600 ep", "v": 78.1 },
      { "m": "I-JEPA", "a": "ViT-H/14 · 300 ep", "v": 79.3, "me": true },
      { "m": "I-JEPA", "a": "ViT-H/16 (448 px) · 300 ep", "v": 81.1, "me": true }
    ]},
    { "name": "El yapımı veri artırma kullananlar", "rows": [
      { "m": "SimCLR v2", "a": "RN152 (2×) · 800 ep", "v": 79.1 },
      { "m": "DINO", "a": "ViT-B/8 · 300 ep", "v": 80.1 },
      { "m": "iBOT", "a": "ViT-L/16 · 250 ep", "v": 81.0 }
    ]}
  ],
  "callout": "81,1 ≈ 81,0 — üstelik 300 epoch",
  "source": "Kaynak: Assran vd. (2023), Tablo 1. Her yöntemin makalede raporlanan en iyi modeli; eksen 76'dan başlar (nokta grafiği)."
}
</script>
<script src="../vendor/gsap/gsap.min.js"></script>
<script src="_base/timeline-runtime.js"></script>
<script>
  const D = PM.data;
  for (const k of ['eyebrow', 'title', 'source']) document.getElementById(k).textContent = D[k];
  const svg = document.getElementById('plot');
  const NS = 'http://www.w3.org/2000/svg';
  const add = (html, cls) => { const g = document.createElementNS(NS, 'g'); if (cls) g.setAttribute('class', cls); g.innerHTML = html; svg.appendChild(g); return g; };

  const X0 = 620, X1 = 1600, ROW = 62, TOP = 20;
  const x = v => X0 + (v - D.axis.min) / (D.axis.max - D.axis.min) * (X1 - X0);

  // Satır düzeni: grup başlığı + satırlar
  let y = TOP;
  const items = [];
  D.groups.forEach((g, gi) => {
    if (gi) y += 14;
    items.push({ type: 'g', y, g: add(`<text class="g" x="0" y="${y}">${g.name}</text>`) });
    y += ROW * 0.85;
    g.rows.forEach(r => {
      const el = add(`<line class="row" x1="${X0}" x2="${X1}" y1="${y}" y2="${y}"/>
        <text class="m" x="0" y="${y}" ${r.me ? 'style="fill:var(--accent)"' : ''}>${r.m}</text>
        <text class="a" x="190" y="${y}">${r.a}</text>`, 'row');
      const dot = add(`<circle class="${r.me ? 'me' : 'dot'}" cx="${x(r.v)}" cy="${y}" r="${r.me ? 15 : 12}"/>
        <text class="v" x="${x(r.v) + 26}" y="${y}" ${r.me ? 'style="fill:var(--accent)"' : ''}>${PM.fmt(r.v, 1)}</text>`, 'dot');
      items.push({ type: 'r', y, el, dot, r });
      y += ROW;
    });
  });
  const BOTTOM = y - ROW / 2 + 10;
  // Eksen
  let ax = '';
  for (let v = D.axis.min; v <= D.axis.max; v += D.axis.step) {
    ax += `<line class="grid" x1="${x(v)}" x2="${x(v)}" y1="${TOP - 20}" y2="${BOTTOM}"/><text class="tick" x="${x(v)}" y="${BOTTOM + 30}">${v}</text>`;
  }
  ax += `<text class="ax" x="${(X0 + X1) / 2}" y="${BOTTOM + 78}">${D.axis.label}</text>`;
  const axis = add(ax, 'axis');
  svg.insertBefore(axis, svg.firstChild);

  // Vurgu: I-JEPA 448 ile iBOT arasında köprü
  const best = items.filter(i => i.type === 'r' && i.r.me).pop();
  const ibot = items.filter(i => i.type === 'r').pop();
  const bx = x(best.r.v) + 105;
  const bridge = add(`<path d="M${bx} ${best.y} C ${bx + 40} ${best.y}, ${bx + 40} ${ibot.y}, ${bx} ${ibot.y}" fill="none" stroke="var(--accent)" stroke-width="4"/>
    <text class="call" x="${bx - 300}" y="${(best.y + ibot.y) / 2}" text-anchor="start"></text>`);
  const bpath = bridge.querySelector('path');
  bridge.querySelector('text').textContent = D.callout;
  { const c = bridge.querySelector("text"); c.setAttribute("x", X1 + 60); c.setAttribute("y", TOP); c.setAttribute("text-anchor", "end"); }

  const tl = PM.timeline();
  tl.from('#eyebrow', { opacity: 0, y: 16, duration: 0.5 })
    .from('#title', { opacity: 0, y: 30, duration: 0.7 }, '-=0.2')
    .from(axis, { opacity: 0, duration: 0.6 }, 1.0);
  let t = 1.4;
  items.forEach(it => {
    if (it.type === 'g') { tl.from(it.g, { opacity: 0, x: -20, duration: 0.4 }, t); t += 0.3; return; }
    tl.from(it.el, { opacity: 0, x: -20, duration: 0.4 }, t)
      .from(it.dot.querySelector('circle'), { attr: { cx: x(D.axis.min) }, opacity: 0, duration: 0.7, ease: 'power3.out' }, t + 0.15)
      .from(it.dot.querySelector('text'), { opacity: 0, duration: 0.3 }, t + 0.7);
    t += 0.42;
  });
  const len = bpath.getTotalLength();
  gsap.set(bpath, { strokeDasharray: len, strokeDashoffset: len });
  tl.to(svg.querySelectorAll('.row, .dot'), { opacity: 0.4, duration: 0.5 }, t + 0.5)
    .to([best.el, best.dot, ibot.el, ibot.dot], { opacity: 1, duration: 0.5 }, t + 0.5)
    .to(bpath, { strokeDashoffset: 0, duration: 0.6, ease: 'power2.inOut' }, t + 0.8)
    .from(bridge.querySelector('text'), { opacity: 0, x: -10, duration: 0.5 }, t + 1.2)
    .from('#source', { opacity: 0, duration: 0.5 }, t + 1.2);
  PM.start();
</script>
</body>
</html>
