<!doctype html>
<html lang="tr" data-theme="corporate-dark">
<head>
<meta charset="utf-8">
<title>KPI sayaçları</title>
<link rel="stylesheet" href="_base/tokens.css">
<link rel="stylesheet" href="_base/stage.css">
<style>
  .row { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 40px; margin-top: 96px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 56px 48px; }
  .label { font-size: var(--fs-small); color: var(--ink-2); font-weight: 600; letter-spacing: .02em; }
  .value { font-size: 128px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; margin: 28px 0 20px; font-variant-numeric: tabular-nums; }
  .value .unit { font-size: 48px; font-weight: 600; color: var(--ink-2); margin-left: 8px; letter-spacing: 0; }
  .delta { font-size: var(--fs-small); font-weight: 700; }
  .delta.good { color: var(--good); } .delta.bad { color: var(--bad); }
</style>
</head>
<body data-hold="2.5">
<div class="pm-stage">
  <div class="pm-eyebrow" id="eyebrow"></div>
  <h2 class="pm-h1" id="title"></h2>
  <div class="row" id="row"></div>
  <div class="pm-source" id="source"></div>
</div>

<script type="application/json" id="pm-data">
{
  "eyebrow": "POC sonuçları",
  "title": "Üç ayda ölçülen etki",
  "items": [
    { "label": "Rapor gecikmesi", "from": 1440, "to": 5, "unit": "dk", "delta": "−%99,7", "tone": "good" },
    { "label": "Aylık altyapı maliyeti", "from": 0, "to": 182500, "unit": "₺", "delta": "−%38", "tone": "good" },
    { "label": "Veri kalite skoru", "from": 0, "to": 97.4, "digits": 1, "prefix": "%", "delta": "+21 puan", "tone": "good" }
  ],
  "source": "Kaynak: POC ortamı ölçümleri, Ağustos–Ekim 2026"
}
</script>
<script src="../vendor/gsap/gsap.min.js"></script>
<script src="_base/timeline-runtime.js"></script>
<script>
  const D = PM.data;
  document.getElementById('eyebrow').textContent = D.eyebrow || '';
  document.getElementById('title').textContent = D.title;
  document.getElementById('source').textContent = D.source || '';
  const row = document.getElementById('row');
  row.style.setProperty('--n', D.items.length);

  const tl = PM.timeline();
  tl.from(['#eyebrow', '#title'], { opacity: 0, y: 30, stagger: 0.15, duration: 0.7 });
  D.items.forEach((it, i) => {
    const c = document.createElement('div');
    c.className = 'card';
    // Türkçe: yüzde işareti başta (%97,4) → "prefix"; birimler sonda (5 dk, 182.500 ₺) → "unit"
    c.innerHTML = `<div class="label">${it.label}</div><div class="value">${it.prefix ? `<span class="unit" style="margin:0 6px 0 0">${it.prefix}</span>` : ''}<span class="n"></span><span class="unit">${it.unit || ''}</span></div>
                   <div class="delta ${it.tone || ''}">${it.delta || ''}</div>`;
    row.appendChild(c);
    const n = c.querySelector('.n');
    const o = { v: it.from ?? 0 };
    n.textContent = PM.fmt(o.v, it.digits || 0);
    const at = 0.8 + i * 0.35;
    tl.from(c, { y: 60, opacity: 0, duration: 0.8 }, at)
      .to(o, { v: it.to, duration: 1.8, ease: 'power3.out', onUpdate: () => { n.textContent = PM.fmt(o.v, it.digits || 0); } }, at + 0.2)
      .from(c.querySelector('.delta'), { opacity: 0, x: -16, duration: 0.5 }, at + 1.6);
  });
  tl.from('#source', { opacity: 0, duration: 0.6 }, '-=0.4');
  PM.start();
</script>
</body>
</html>
