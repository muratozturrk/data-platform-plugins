<!doctype html>
<html lang="tr" data-theme="corporate-dark">
<head>
<meta charset="utf-8">
<title>Başlık sahnesi</title>
<link rel="stylesheet" href="_base/tokens.css">
<link rel="stylesheet" href="_base/stage.css">
<style>
  .wrap { position: absolute; left: var(--safe); right: var(--safe); top: 50%; transform: translateY(-50%); }
  .title { font-size: var(--fs-hero); line-height: 1.02; font-weight: 800; letter-spacing: -0.035em; max-width: 1500px; margin: 28px 0 36px; }
  .rule { height: 6px; width: 220px; background: var(--accent); border-radius: 3px; transform-origin: left center; margin-bottom: 36px; }
  .subtitle { font-size: var(--fs-h2); color: var(--ink-2); font-weight: 400; max-width: 1400px; }
  .meta { position: absolute; left: var(--safe); bottom: 96px; font-size: var(--fs-small); color: var(--muted); display: flex; gap: 40px; }
  .glow { position: absolute; width: 1100px; height: 1100px; right: -300px; top: -380px; border-radius: 50%;
          background: radial-gradient(circle, color-mix(in srgb, var(--accent) 38%, transparent) 0%, transparent 65%); }
</style>
</head>
<body data-hold="2">
<div class="pm-stage">
  <div class="glow"></div>
  <div class="wrap">
    <div class="pm-eyebrow" id="eyebrow"></div>
    <h1 class="title" id="title"></h1>
    <div class="rule" id="rule"></div>
    <div class="subtitle" id="subtitle"></div>
  </div>
  <div class="meta"><span id="author"></span><span id="date"></span></div>
</div>

<script type="application/json" id="pm-data">
{
  "eyebrow": "Veri Platformu · 2026",
  "title": "Gerçek zamanlı analitik platformu",
  "subtitle": "Raporlama süresini 24 saatten 5 dakikaya indiren mimari",
  "author": "Murat Öztürk",
  "date": "Kasım 2026"
}
</script>
<script src="../vendor/gsap/gsap.min.js"></script>
<script src="../vendor/gsap/SplitText.min.js"></script>
<script src="_base/timeline-runtime.js"></script>
<script>
  gsap.registerPlugin(SplitText);
  const D = PM.data;
  for (const k of ['eyebrow', 'title', 'subtitle', 'author', 'date']) document.getElementById(k).textContent = D[k] || '';

  const split = SplitText.create('#title', { type: 'lines,words,chars', mask: 'lines' });
  const tl = PM.timeline();
  tl.from('.glow', { opacity: 0, scale: 0.6, duration: 2.2, ease: 'power2.out' }, 0)
    .from('#eyebrow', { y: 24, opacity: 0, duration: 0.6 }, 0.2)
    .from(split.chars, { yPercent: 110, duration: 0.9, stagger: 0.022, ease: 'expo.out' }, 0.35)
    .from('#rule', { scaleX: 0, duration: 0.8, ease: 'power4.inOut' }, '-=0.5')
    .from('#subtitle', { y: 30, opacity: 0, duration: 0.8 }, '-=0.45')
    .from('.meta span', { opacity: 0, y: 12, stagger: 0.12, duration: 0.5 }, '-=0.3');
  PM.start();
</script>
</body>
</html>
