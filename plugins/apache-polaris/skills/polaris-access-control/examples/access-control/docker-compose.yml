# Access-control example stack: Apache Polaris + S3-compatible storage with STS (credential vending).
# Modeled on the Polaris getting-started compose files (https://github.com/apache/polaris/tree/main/getting-started)
# with local SeaweedFS instead of AWS S3. Run with: docker compose -p polaris-access-control up -d --build
# No container_name / host ports: other lab stacks may run in parallel on the same host.
services:
  runner:
    build: runner
    depends_on:
      polaris: {condition: service_healthy}
      create-bucket: {condition: service_completed_successfully}
    volumes:
      - ./:/labs
    environment:
      POLARIS_URI: http://polaris:8181
      POLARIS_ROOT_CLIENT_ID: root
      POLARIS_ROOT_CLIENT_SECRET: s3cr3t
      S3_ENDPOINT: http://seaweedfs:8333
      AWS_REGION: us-east-1
    networks: [lake_net]

  polaris:
    image: apache/polaris:latest   # 1.8.0 on Docker Hub at the time of the test run
    environment:
      # Polaris itself writes table metadata to S3 with these keys; engines never see them.
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
      polaris.realm-context.realms: POLARIS
      quarkus.otel.sdk.disabled: "true"
      JAVA_OPTS_APPEND: -Xms128m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8182/q/health/ready >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
    networks: [lake_net]

  seaweedfs:
    # S3-compatible object store with STS AssumeRole (MinIO images are no longer on Docker Hub).
    image: chrislusf/seaweedfs
    command: "server -s3 -s3.config=/etc/seaweedfs/s3.json -s3.iam.config=/etc/seaweedfs/iam.json -dir=/data -volume.max=100 -master.volumeSizeLimitMB=64"
    volumes:
      - ./config/s3.json:/etc/seaweedfs/s3.json:ro
      - ./config/iam.json:/etc/seaweedfs/iam.json:ro
    networks: [lake_net]

  create-bucket:
    image: chrislusf/seaweedfs
    depends_on: [seaweedfs]
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      for b in warehouse finance-bucket; do
        until echo 's3.bucket.list' | weed shell -master=seaweedfs:9333 2>/dev/null | grep -q $$b; do
          echo \"s3.bucket.create -name $$b\" | weed shell -master=seaweedfs:9333 >/dev/null 2>&1; sleep 2;
        done;
      done; echo buckets ready
      "
    networks: [lake_net]

networks:
  lake_net:
