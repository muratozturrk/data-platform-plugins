# Apache Polaris federating external Iceberg REST catalogs (reference server, Gravitino, Lakekeeper).
# Modeled on the Polaris getting-started compose files (https://github.com/apache/polaris/tree/main/getting-started),
# with local SeaweedFS instead of AWS S3. Run with: docker compose -p polaris-federation up -d --build
# No container_name / host ports: other lab stacks may run in parallel on the same host.
services:
  runner:
    build: runner
    depends_on:
      polaris: {condition: service_healthy}
      rest: {condition: service_started}
      gravitino: {condition: service_started}
      lakekeeper: {condition: service_started}
      create-bucket: {condition: service_completed_successfully}
    volumes:
      - ./:/labs
    environment:
      POLARIS_URI: http://polaris:8181
      ICEBERG_REST_URI: http://rest:8181
      GRAVITINO_URI: http://gravitino:9001/iceberg
      LAKEKEEPER_URI: http://lakekeeper:8181
      POLARIS_ROOT_CLIENT_ID: root
      POLARIS_ROOT_CLIENT_SECRET: s3cr3t
      S3_ENDPOINT: http://seaweedfs:8333
      AWS_REGION: us-east-1
    networks: [lake_net]

  rest:
    # Apache Iceberg REST catalog reference server: a second, minimal REST implementation.
    image: apache/iceberg-rest-fixture:1.8.1
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/rest/
      CATALOG_URI: jdbc:sqlite:file:/tmp/iceberg_catalog.db
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://seaweedfs:8333
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    networks: [lake_net]

  gravitino:
    # Apache Gravitino Iceberg REST server (standalone), SQLite backend, data on SeaweedFS.
    image: apache/gravitino-iceberg-rest:latest
    environment:
      GRAVITINO_ICEBERG_REST_CATALOG_BACKEND: jdbc
      GRAVITINO_ICEBERG_REST_URI: jdbc:sqlite:file:/tmp/gravitino_catalog.db
      GRAVITINO_ICEBERG_REST_WAREHOUSE: s3://warehouse/gravitino/
      GRAVITINO_ICEBERG_REST_IO_IMPL: org.apache.iceberg.aws.s3.S3FileIO
      GRAVITINO_ICEBERG_REST_S3_ACCESS_KEY: admin
      GRAVITINO_ICEBERG_REST_S3_SECRET_KEY: password
      GRAVITINO_ICEBERG_REST_S3_ENDPOINT: http://seaweedfs:8333
      GRAVITINO_ICEBERG_REST_S3_REGION: us-east-1
      GRAVITINO_ICEBERG_REST_S3_PATH_STYLE_ACCESS: "true"
      GRAVITINO_ICEBERG_REST_CREDENTIAL_PROVIDERS: s3-secret-key
      JAVA_OPTS: -Xmx384m
    networks: [lake_net]

  lakekeeper-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: lakekeeper
      POSTGRES_DB: lakekeeper
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakekeeper"]
      interval: 3s
      retries: 30
    networks: [lake_net]

  lakekeeper-migrate:
    image: vakamo/lakekeeper:latest
    command: ["migrate"]
    environment: &lakekeeper_env
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:lakekeeper@lakekeeper-db:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:lakekeeper@lakekeeper-db:5432/lakekeeper
      LAKEKEEPER__PG_ENCRYPTION_KEY: lab-only-encryption-key-change-me
    depends_on:
      lakekeeper-db: {condition: service_healthy}
    restart: "no"
    networks: [lake_net]

  lakekeeper:
    # Lakekeeper (Rust Iceberg REST catalog), no authentication configured (lab only).
    image: vakamo/lakekeeper:latest
    command: ["serve"]
    environment: *lakekeeper_env
    depends_on:
      lakekeeper-migrate: {condition: service_completed_successfully}
    networks: [lake_net]

  polaris:
    image: apache/polaris:latest   # 1.8.0 on Docker Hub at the time of the test run
    environment:
      # Polaris itself writes table metadata to S3 with these keys; engines never see them.
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
      polaris.realm-context.realms: POLARIS
      quarkus.otel.sdk.disabled: "true"
      # Catalog federation (external catalogs reached through an Iceberg REST connection).
      polaris.features."ENABLE_CATALOG_FEDERATION": "true"
      polaris.features."SUPPORTED_CATALOG_CONNECTION_TYPES": '["ICEBERG_REST"]'
      polaris.features."SUPPORTED_EXTERNAL_CATALOG_AUTHENTICATION_TYPES": '["OAUTH","BEARER","IMPLICIT"]'
      JAVA_OPTS_APPEND: -Xms128m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8182/q/health/ready >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
    networks: [lake_net]

  seaweedfs:
    # S3-compatible object store with STS AssumeRole (MinIO images are no longer on Docker Hub).
    image: chrislusf/seaweedfs
    command: "server -s3 -s3.config=/etc/seaweedfs/s3.json -s3.iam.config=/etc/seaweedfs/iam.json -dir=/data -volume.max=100 -master.volumeSizeLimitMB=64"
    volumes:
      - ./config/s3.json:/etc/seaweedfs/s3.json:ro
      - ./config/iam.json:/etc/seaweedfs/iam.json:ro
    networks: [lake_net]

  create-bucket:
    image: chrislusf/seaweedfs
    depends_on: [seaweedfs]
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      for b in warehouse finance-bucket; do
        until echo 's3.bucket.list' | weed shell -master=seaweedfs:9333 2>/dev/null | grep -q $$b; do
          echo \"s3.bucket.create -name $$b\" | weed shell -master=seaweedfs:9333 >/dev/null 2>&1; sleep 2;
        done;
      done; echo buckets ready
      "
    networks: [lake_net]

networks:
  lake_net:
