# Snowflake stand-in stack. Snowflake itself cannot run locally; the tests check the Polaris side of the
# integration (the service principal Snowflake uses, its privileges, scopes, vended reads) and the
# production settings on three Polaris 1.8.0 servers.
# Run with: docker compose -p polaris-snowflake up -d --build   (no container_name / host ports)
x-polaris: &polaris
  image: apache/polaris:latest   # 1.8.0 on Docker Hub at the time of the test run
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://localhost:8182/q/health/ready >/dev/null"]
    interval: 5s
    timeout: 5s
    retries: 40
  networks: [lake_net]

services:
  runner:
    build: runner
    depends_on:
      polaris: {condition: service_healthy}
      polaris-dev: {condition: service_healthy}
      polaris-prod: {condition: service_healthy}
      create-bucket: {condition: service_completed_successfully}
    volumes:
      - ./:/labs
      - /var/run/docker.sock:/var/run/docker.sock   # read polaris-dev logs (production_settings)
    environment:
      POLARIS_URI: http://polaris:8181
      POLARIS_ROOT_CLIENT_ID: root
      POLARIS_ROOT_CLIENT_SECRET: s3cr3t
      S3_ENDPOINT: http://seaweedfs:8333
      AWS_REGION: us-east-1
    networks: [lake_net]

  # The Polaris that "Snowflake" connects to: S3 storage with STS credential vending.
  polaris:
    <<: *polaris
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
      polaris.realm-context.realms: POLARIS
      quarkus.otel.sdk.disabled: "true"
      JAVA_OPTS_APPEND: -Xms128m -Xmx512m

  # "Dev mode": no bootstrap credentials given (root credentials are printed in the logs).
  polaris-dev:
    <<: *polaris
    environment:
      polaris.realm-context.realms: POLARIS
      quarkus.otel.sdk.disabled: "true"
      JAVA_OPTS_APPEND: -Xms128m -Xmx384m

  # Production settings, as Polaris 1.x configuration properties.
  polaris-prod:
    <<: *polaris
    environment:
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
      polaris.realm-context.realms: POLARIS
      quarkus.otel.sdk.disabled: "true"
      polaris.features."ENFORCE_PRINCIPAL_CREDENTIAL_ROTATION_REQUIRED_CHECKING": "true"
      polaris.authentication.token-broker.type: symmetric-key
      polaris.authentication.token-broker.symmetric-key.secret: lab-only-symmetric-secret-change-me
      polaris.authentication.token-broker.max-token-generation: PT30M
      JAVA_OPTS_APPEND: -Xms128m -Xmx384m

  seaweedfs:
    image: chrislusf/seaweedfs
    command: "server -s3 -s3.config=/etc/seaweedfs/s3.json -s3.iam.config=/etc/seaweedfs/iam.json -dir=/data -volume.max=100 -master.volumeSizeLimitMB=64"
    volumes:
      - ./config/s3.json:/etc/seaweedfs/s3.json:ro
      - ./config/iam.json:/etc/seaweedfs/iam.json:ro
    networks: [lake_net]

  create-bucket:
    image: chrislusf/seaweedfs
    depends_on: [seaweedfs]
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until echo 's3.bucket.list' | weed shell -master=seaweedfs:9333 2>/dev/null | grep -q warehouse; do
        echo 's3.bucket.create -name warehouse' | weed shell -master=seaweedfs:9333 >/dev/null 2>&1; sleep 2;
      done; echo bucket ready
      "
    networks: [lake_net]

networks:
  lake_net:
