# Polaris CLI, realms and configuration properties on Polaris 1.8.0.
# Each Polaris service carries one group of settings, so every behavior is tested on a server
# configured exactly that way. Run with: docker compose -p polaris-config up -d --build
x-polaris: &polaris
  image: apache/polaris:latest   # 1.8.0 on Docker Hub at the time of the test run
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://localhost:8182/q/health/ready >/dev/null"]
    interval: 5s
    timeout: 5s
    retries: 60
  networks: [lake_net]

services:
  runner:
    build: runner
    image: polaris-config-runner:latest
    depends_on:
      polaris: {condition: service_healthy}
      polaris-realms: {condition: service_healthy}
      polaris-legacy-env: {condition: service_healthy}
      polaris-hard: {condition: service_healthy}
      polaris-durable: {condition: service_healthy}
      polaris-ratelimit-invalid: {condition: service_healthy}
    volumes:
      - ./:/labs
      - secrets:/secrets:ro
      - /var/run/docker.sock:/var/run/docker.sock     # container logs and exit codes
    environment:
      POLARIS_URI: http://polaris:8181
      POLARIS_ROOT_CLIENT_ID: root
      POLARIS_ROOT_CLIENT_SECRET: s3cr3t
    networks: [lake_net]

  keys:
    image: polaris-config-runner:latest
    build: runner
    command: ["python", "/labs/config/make_keys.py"]
    volumes:
      - ./config:/labs/config:ro
      - secrets:/secrets
    restart: "no"
    networks: [lake_net]

  # CLI target. The CLI session uses a file-backed my_catalog, so FILE storage is enabled
  # (the default refusal is tested on polaris-durable).
  polaris:
    <<: *polaris
    environment:
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
      polaris.features."ALLOW_INSECURE_STORAGE_TYPES": "true"
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": '["FILE","S3","GCS","AZURE"]'
      polaris.readiness.ignore-severe-issues: "true"
      quarkus.otel.sdk.disabled: "true"
      JAVA_OPTS_APPEND: -Xms128m -Xmx384m

  # Realms: two realms on one server, root credentials for both.
  polaris-realms:
    <<: *polaris
    environment:
      polaris.realm-context.realms: POLARIS,my_team_realm
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t;my_team_realm,root,t3amsecret
      quarkus.otel.sdk.disabled: "true"
      JAVA_OPTS_APPEND: -Xms128m -Xmx384m

  # Realms: per-realm bootstrap variables from older Polaris docs (ignored by 1.8.0).
  polaris-legacy-env:
    <<: *polaris
    environment:
      polaris.realm-context.realms: my_realm
      POLARIS_BOOTSTRAP_MY_REALM_ROOT_CLIENT_ID: my-client-id
      POLARIS_BOOTSTRAP_MY_REALM_ROOT_CLIENT_SECRET: my-secret
      quarkus.otel.sdk.disabled: "true"
      JAVA_OPTS_APPEND: -Xms128m -Xmx384m

  # relational-jdbc: admin tool with a templated {realm} JDBC URL and with a concrete database name.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: polaris
      POSTGRES_DB: polaris
    volumes:
      - ./config/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polaris -d my_realm"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [lake_net]

  bootstrap-templated:
    image: apache/polaris-admin-tool:latest
    depends_on:
      postgres: {condition: service_healthy}
    command: ["bootstrap", "-r", "my_realm", "-c", "my_realm,client-id,my-secret"]
    environment:
      polaris.persistence.type: relational-jdbc
      quarkus.datasource.db-kind: postgresql
      quarkus.datasource.jdbc.url: "jdbc:postgresql://postgres:5432/{realm}"
      quarkus.datasource.username: polaris
      quarkus.datasource.password: polaris
    restart: "no"
    networks: [lake_net]

  # The same bootstrap flags with a concrete database name, and a server on that database.
  bootstrap-fixed:
    image: apache/polaris-admin-tool:latest
    depends_on:
      postgres: {condition: service_healthy}
    command: ["bootstrap", "-r", "my_realm", "-c", "my_realm,client-id,my-secret"]
    environment: &durable_env
      polaris.persistence.type: relational-jdbc
      quarkus.datasource.db-kind: postgresql
      quarkus.datasource.jdbc.url: jdbc:postgresql://postgres:5432/my_realm
      quarkus.datasource.username: polaris
      quarkus.datasource.password: polaris
    restart: "no"
    networks: [lake_net]

  polaris-durable:
    <<: *polaris
    depends_on:
      bootstrap-fixed: {condition: service_completed_successfully}
    environment:
      <<: *durable_env
      polaris.realm-context.realms: my_realm
      quarkus.otel.sdk.disabled: "true"
      JAVA_OPTS_APPEND: -Xms128m -Xmx384m

  # Hardening settings (two realms for the realm-override test).
  polaris-hard:
    <<: *polaris
    depends_on:
      keys: {condition: service_completed_successfully}
    volumes:
      - secrets:/secrets:ro
    environment:
      polaris.realm-context.realms: POLARIS,analytics
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t;analytics,root,s3cr3t
      polaris.authentication.token-broker.type: rsa-key-pair
      polaris.authentication.token-broker.rsa-key-pair.public-key-file: /secrets/public.key
      polaris.authentication.token-broker.rsa-key-pair.private-key-file: /secrets/private.key
      polaris.rate-limiter.filter.type: default            # not token-bucket (see polaris-ratelimit-invalid)
      polaris.rate-limiter.token-bucket.requests-per-second: "5"
      polaris.rate-limiter.token-bucket.window: PT1S
      polaris.tasks.max-concurrent-tasks: "200"
      polaris.tasks.max-queued-tasks: "1000"
      # The ".defaults." form from older docs, with a value that differs from the built-in default:
      polaris.features.defaults."SUPPORTED_CATALOG_STORAGE_TYPES": '["S3","GCS","AZURE","FILE"]'
      polaris.features."ALLOW_INSECURE_STORAGE_TYPES": "true"
      polaris.features.realm-overrides."analytics"."SUPPORTED_CATALOG_STORAGE_TYPES": '["S3"]'
      polaris.readiness.ignore-severe-issues: "true"
      quarkus.log.console.json.enabled: "true"
      polaris.log.mdc.environment: prod
      quarkus.otel.sdk.disabled: "true"
      JAVA_OPTS_APPEND: -Xms128m -Xmx384m

  # filter.type=token-bucket: an invalid rate-limiter value, isolated because it breaks every request.
  polaris-ratelimit-invalid:
    <<: *polaris
    environment:
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
      polaris.rate-limiter.filter.type: token-bucket
      polaris.rate-limiter.token-bucket.requests-per-second: "1000"
      polaris.rate-limiter.token-bucket.window: PT10S
      quarkus.otel.sdk.disabled: "true"
      JAVA_OPTS_APPEND: -Xms128m -Xmx384m

volumes:
  secrets:

networks:
  lake_net:
