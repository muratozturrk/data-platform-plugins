# Spark SQL authorization through Apache Kyuubi AuthZ (Ranger-backed)
spark.jars.packages            org.apache.kyuubi:kyuubi-spark-authz_2.12:1.10.1
spark.sql.extensions           org.apache.kyuubi.plugin.spark.authz.ranger.RangerSparkExtension,org.projectnessie.spark.extensions.NessieSparkSessionExtensions,org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.driver.extraClassPath    /opt/spark/ranger-conf
