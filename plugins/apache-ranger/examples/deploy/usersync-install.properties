# Option A: LDAP directory is the source of truth (also federated into Keycloak)
POLICY_MGR_URL=https://ranger.platform-ranger.svc:6182
SYNC_SOURCE=ldap
SYNC_INTERVAL=5
SYNC_LDAP_URL=ldaps://ldap.hkm.internal:636
SYNC_LDAP_BIND_DN=cn=ranger-bind,ou=svc,dc=hkm,dc=internal
SYNC_LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD}
SYNC_LDAP_DELTASYNC=true
SYNC_LDAP_SEARCH_BASE=dc=hkm,dc=internal
SYNC_LDAP_USER_SEARCH_BASE=ou=people,dc=hkm,dc=internal
SYNC_LDAP_USER_OBJECT_CLASS=inetOrgPerson
SYNC_LDAP_USER_NAME_ATTRIBUTE=uid
SYNC_LDAP_USER_GROUP_NAME_ATTRIBUTE=memberOf
SYNC_LDAP_USERNAME_CASE_CONVERSION=lower
SYNC_LDAP_GROUPNAME_CASE_CONVERSION=lower
SYNC_GROUP_SEARCH_ENABLED=true
SYNC_GROUP_USER_MAP_SYNC_ENABLED=true
SYNC_GROUP_SEARCH_BASE=ou=groups,dc=hkm,dc=internal
SYNC_GROUP_OBJECT_CLASS=groupOfNames
SYNC_LDAP_GROUP_SEARCH_FILTER=(cn=platform_*)
SYNC_GROUP_NAME_ATTRIBUTE=cn
SYNC_GROUP_MEMBER_ATTRIBUTE_NAME=member
SYNC_LDAP_REFERRAL=follow
rangerUsersync_password=${RANGER_USERSYNC_PASSWORD}
