---
# Local/CI harness: Ranger Admin + PostgreSQL + OpenSearch + Trino with Ranger access control (decision-table tests)
name: ranger-harness
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 3s, retries: 30 }
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment: { discovery.type: single-node, DISABLE_SECURITY_PLUGIN: "true", OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m" }
    healthcheck: { test: ["CMD-SHELL", "curl -sf localhost:9200"], interval: 5s, retries: 40 }
  ranger:
    image: ${RANGER_IMAGE:-registry.hkm.internal/platform/ranger-admin:2.8.0-hkm.1}
    environment: { PG_ROOT_PASSWORD: postgres, RANGER_DB_PASSWORD: "rangerR0cks!", RANGER_ADMIN_PASSWORD: "rangerR0cks!", RANGER_TAGSYNC_PASSWORD: "rangerR0cks!", RANGER_USERSYNC_PASSWORD: "rangerR0cks!", RANGER_KEYADMIN_PASSWORD: "rangerR0cks!" }
    volumes: ["./install.test.properties:/opt/ranger/install.properties:ro"]
    depends_on: { postgres: { condition: service_healthy }, opensearch: { condition: service_healthy } }
    ports: ["6080"]
    healthcheck: { test: ["CMD-SHELL", "curl -sf -u admin:rangerR0cks! localhost:6080/service/public/v2/api/servicedef/name/trino"], interval: 10s, retries: 60 }
  trino:
    image: trinodb/trino:484
    volumes: ["../plugins/trino:/etc/trino-ranger:ro", "./trino-etc:/etc/trino"]
    depends_on: { ranger: { condition: service_healthy } }
    ports: ["8080"]
