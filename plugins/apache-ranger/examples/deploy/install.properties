# Ranger Admin install.properties (values with ${...} come from Secrets rendered by ESO)
PYTHON_COMMAND_INVOKER=python3
DB_FLAVOR=POSTGRES
SQL_CONNECTOR_JAR=/usr/share/java/postgresql.jar
db_root_user=postgres
db_root_password=${PG_ROOT_PASSWORD}
db_host=postgres-ranger.platform-ranger.svc:5432
db_name=ranger
db_user=rangeradmin
db_password=${RANGER_DB_PASSWORD}
rangerAdmin_password=${RANGER_ADMIN_PASSWORD}
rangerTagsync_password=${RANGER_TAGSYNC_PASSWORD}
rangerUsersync_password=${RANGER_USERSYNC_PASSWORD}
keyadmin_password=${RANGER_KEYADMIN_PASSWORD}

policymgr_external_url=https://ranger.platform-ranger.svc:6182
policymgr_http_enabled=false
policymgr_https_keystore_file=/etc/ranger/tls/keystore.p12
policymgr_https_keystore_keyalias=ranger
policymgr_https_keystore_password=${RANGER_KEYSTORE_PASSWORD}

# Access-audit store used by the Admin audit UI (verify ES client compatibility with the platform OpenSearch)
audit_store=elasticsearch
audit_elasticsearch_urls=opensearch.platform-observability.svc
audit_elasticsearch_port=9200
audit_elasticsearch_protocol=https
audit_elasticsearch_user=ranger_audit
audit_elasticsearch_password=${RANGER_AUDIT_OS_PASSWORD}
audit_elasticsearch_index=ranger-audit
audit_elasticsearch_bootstrap_enabled=true

# Admin UI authentication: LDAP when a directory exists; otherwise NONE (internal users) behind an authenticating proxy
authentication_method=LDAP
xa_ldap_url=ldaps://ldap.hkm.internal:636
xa_ldap_userDNpattern=uid={0},ou=people,dc=hkm,dc=internal
xa_ldap_groupSearchBase=ou=groups,dc=hkm,dc=internal
xa_ldap_groupSearchFilter=(member=uid={0},ou=people,dc=hkm,dc=internal)
xa_ldap_groupRoleAttribute=cn
xa_ldap_bind_dn=cn=ranger-bind,ou=svc,dc=hkm,dc=internal
xa_ldap_bind_password=${LDAP_BIND_PASSWORD}

unix_user=ranger
unix_group=ranger
RANGER_ADMIN_LOG_DIR=/var/log/ranger
ranger_admin_max_heap_size=2g
