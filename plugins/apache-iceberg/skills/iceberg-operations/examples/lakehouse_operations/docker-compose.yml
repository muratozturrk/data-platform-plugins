# Local Iceberg lakehouse: Spark + Airflow (in-process) + Iceberg REST catalog + SeaweedFS (S3 API)
# + Prometheus Pushgateway. Based on the official Apache Iceberg Spark quickstart:
# https://iceberg.apache.org/spark-quickstart/
# No container names and no published ports: several stacks can run side by side.
# Run with: docker compose -p iceberg-lakehouse-operations up -d --build
services:
  spark-iceberg:
    build: .
    depends_on:
      rest: {condition: service_started}
      pushgateway: {condition: service_started}
      create-bucket: {condition: service_completed_successfully}
    volumes:
      - ./:/home/iceberg/labs
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-admin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-password}
      AWS_REGION: us-east-1
      ICEBERG_REST_URI: http://rest:8181
      S3_ENDPOINT: http://seaweedfs:8333
      PUSHGATEWAY_URL: http://pushgateway:9091
    networks: [iceberg_net]

  rest:
    image: apache/iceberg-rest-fixture:1.8.1   # keep in sync with the Spark Iceberg runtime (1.8.1)
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-admin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-password}
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      # File-backed SQLite: the default in-memory DB is per-connection and breaks concurrent commits.
      CATALOG_URI: jdbc:sqlite:file:/tmp/iceberg_catalog.db
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://seaweedfs:8333
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    networks: [iceberg_net]

  seaweedfs:
    # S3-compatible object store (MinIO images are no longer published on Docker Hub).
    image: chrislusf/seaweedfs
    command: "server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -volume.max=100 -master.volumeSizeLimitMB=256"
    volumes:
      - ./config/s3.json:/etc/seaweedfs/s3.json:ro
    networks: [iceberg_net]

  create-bucket:
    # "warehouse" = primary region, "warehouse-dr" = disaster-recovery region (disaster_recovery tests).
    image: chrislusf/seaweedfs
    depends_on: [seaweedfs]
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      for b in warehouse warehouse-dr; do
        until echo 's3.bucket.list' | weed shell -master=seaweedfs:9333 2>/dev/null | grep -q $$b; do
          echo s3.bucket.create -name $$b | weed shell -master=seaweedfs:9333 >/dev/null 2>&1; sleep 2;
        done; echo bucket $$b ready;
      done
      "
    networks: [iceberg_net]

  pushgateway:
    # Prometheus Pushgateway: target of the metrics pushed by the maintenance DAG.
    image: prom/pushgateway:v1.10.0
    networks: [iceberg_net]

networks:
  iceberg_net:
