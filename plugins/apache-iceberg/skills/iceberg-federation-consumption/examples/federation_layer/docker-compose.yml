# Federation layer lab: Trino federating an Iceberg lakehouse (REST catalog + SeaweedFS S3)
# with an operational PostgreSQL database.
# Modeled on the Trino Docker deployment docs (https://trino.io/docs/current/installation/containers.html)
# and the Iceberg quickstart stack (https://iceberg.apache.org/spark-quickstart/).
# No container_name / published ports: several stacks can run side by side.
# Credentials are local-only dev defaults; override them through environment variables or an .env file.
# Run with: docker compose -p iceberg-federation-layer up -d --build
services:
  trino:
    image: trinodb/trino:483
    depends_on:
      rest: {condition: service_started}
      postgres: {condition: service_healthy}
      create-bucket: {condition: service_completed_successfully}
    volumes:
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/access-control.properties:/etc/trino/access-control.properties:ro
      - ./trino/rules.json:/etc/trino/rules.json:ro
      - ./trino/resource-groups.properties:/etc/trino/resource-groups.properties:ro
      - ./trino/resource-groups.json:/etc/trino/resource-groups.json:ro
      - ./trino/catalog:/etc/trino/catalog:ro
    environment:
      # fix: resolved by ${ENV:...} in trino/catalog/*.properties instead of hardcoded secrets
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-admin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-password}
      PG_USER: ${POSTGRES_USER:-ops}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-ops}
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    networks: [lake_net]

  postgres:
    # Operational (OLTP) database that stays outside the lakehouse.
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ops
      POSTGRES_USER: ${POSTGRES_USER:-ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ops}
    command: ["postgres", "-c", "track_counts=on", "-c", "log_min_duration_statement=-1"]
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ops"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [lake_net]

  rest:
    image: apache/iceberg-rest-fixture:1.8.1
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-admin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-password}
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      # File-backed SQLite: the default in-memory DB is per-connection.
      CATALOG_URI: jdbc:sqlite:file:/tmp/iceberg_catalog.db
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://seaweedfs:8333
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    mem_limit: 768m
    networks: [lake_net]

  seaweedfs:
    # S3-compatible object store (MinIO images are no longer published on Docker Hub).
    image: chrislusf/seaweedfs
    command: "server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -volume.max=100 -master.volumeSizeLimitMB=256"
    volumes:
      - ./config/s3.json:/etc/seaweedfs/s3.json:ro
    networks: [lake_net]

  create-bucket:
    image: chrislusf/seaweedfs
    depends_on: [seaweedfs]
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until echo 's3.bucket.list' | weed shell -master=seaweedfs:9333 2>/dev/null | grep -q warehouse; do
        echo 's3.bucket.create -name warehouse' | weed shell -master=seaweedfs:9333 >/dev/null 2>&1; sleep 2;
      done; echo bucket warehouse ready
      "
    networks: [lake_net]

  runner:
    # Test runner: Python clients only (trino DB-API, psycopg, PyIceberg).
    build: ./runner
    depends_on:
      trino: {condition: service_healthy}
    volumes:
      - ./:/labs
    environment:
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      PG_DSN: postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops}@postgres:5432/ops
      ICEBERG_REST_URI: http://rest:8181
      S3_ENDPOINT: http://seaweedfs:8333
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-admin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-password}
      AWS_REGION: us-east-1
    command: ["sleep", "infinity"]
    networks: [lake_net]

networks:
  lake_net:
