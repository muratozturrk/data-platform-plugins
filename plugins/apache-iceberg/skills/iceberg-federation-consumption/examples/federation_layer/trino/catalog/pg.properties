# Operational PostgreSQL database, queried in place.
# https://trino.io/docs/current/connector/postgresql.html
connector.name=postgresql
connection-url=jdbc:postgresql://postgres:5432/ops
# fix: credentials come from the container environment (Trino ${ENV:...} substitution)
connection-user=${ENV:PG_USER}
connection-password=${ENV:PG_PASSWORD}
# Push joins between two PostgreSQL tables down to PostgreSQL.
join-pushdown.enabled=true
