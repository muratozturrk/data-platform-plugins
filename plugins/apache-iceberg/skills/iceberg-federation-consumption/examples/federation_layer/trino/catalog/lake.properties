# Iceberg lakehouse through the Iceberg REST catalog, data on SeaweedFS (S3 API).
# https://trino.io/docs/current/connector/iceberg.html
# https://trino.io/docs/current/object-storage/file-system-s3.html
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://rest:8181
iceberg.rest-catalog.warehouse=s3://warehouse/
iceberg.file-format=PARQUET
fs.native-s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.region=us-east-1
s3.path-style-access=true
# fix: secrets come from the container environment (Trino ${ENV:...} substitution)
s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
