# Keycloak CR for the Keycloak Operator (CRD version v2beta1 since 26.6).
# Image built from ./Dockerfile; with a custom image the operator starts it optimized and
# ignores build-time options given here.
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: hkm-sso
  namespace: iam
spec:
  instances: 3
  image: registry.hkm.example/platform/keycloak:26.8.2-hkm.1
  db:
    vendor: postgres
    host: keycloak-db-rw            # CloudNativePG read-write service (primary only)
    database: keycloak
    usernameSecret:
      name: keycloak-db-app         # created by CNPG
      key: username
    passwordSecret:
      name: keycloak-db-app
      key: password
    poolMinSize: 10
    poolMaxSize: 50
  http:
    tlsSecret: sso-tls              # cert-manager; ingress re-encrypts to this
  hostname:
    hostname: https://sso.hkm.example
    admin: https://sso-admin.hkm.internal   # admin console only on the internal network
  proxy:
    headers: forwarded              # the ingress overwrites Forwarded; trusted only from proxy-trusted-addresses
  ingress:
    enabled: false                  # platform ingress/Gateway defined separately
  truststores:
    institution-cas:
      secret:
        name: institution-idp-cas   # PEM bundle: institution IdP and LDAPS CAs
    db-ca:
      secret:
        name: keycloak-db-ca        # only ca.crt copied from the CNPG CA secret, never ca.key; for db-tls-mode=verify-server
  update:
    strategy: Auto                  # rolling only when the operator finds the update compatible
  resources:
    requests:
      cpu: "2"
      memory: 2Gi
    limits:
      cpu: "5"                      # ~150 % headroom over the request
      memory: 2Gi
  scheduling:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: keycloak
            app.kubernetes.io/instance: hkm-sso
  additionalOptions:
    - name: log-console-output
      value: json
    - name: http-access-log-enabled
      value: "true"
    - name: cache-embedded-cluster-name
      value: hkm-prod
    - name: proxy-trusted-addresses
      value: 10.42.0.0/16           # ingress pod CIDR only (IPs/CIDRs, no hostnames)
    - name: db-tls-mode
      value: verify-server
    - name: https-protocols
      value: "TLSv1.3,TLSv1.2"      # TLS 1.2 minimum; 1.3 only once every client is confirmed
    - name: http-max-queued-requests
      value: "1000"                 # illustrative; sheds overload with 503, size from load tests
    # Event listener log levels (SPI option names: verify with `kc.sh show-config` for the pinned version)
    - name: spi-events-listener--jboss-logging--success-level
      value: info
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hkm-sso
  namespace: iam
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: keycloak
      app.kubernetes.io/instance: hkm-sso
