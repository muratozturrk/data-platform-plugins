# kube-apiserver structured authentication configuration (--authentication-config).
# Check the API version supported by the cluster's Kubernetes release before use.
apiVersion: apiserver.config.k8s.io/v1
kind: AuthenticationConfiguration
jwt:
  - issuer:
      url: https://sso.hkm.example/realms/hkm
      audiences:
        - kubernetes
    claimMappings:
      username:
        claim: preferred_username
        prefix: "oidc:"
      groups:
        claim: groups
        prefix: "oidc:"
    claimValidationRules:
      - expression: "has(claims.preferred_username)"
        message: preferred_username is required
