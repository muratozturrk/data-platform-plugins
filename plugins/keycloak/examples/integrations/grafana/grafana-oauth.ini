[auth.generic_oauth]
enabled = true
name = HKM SSO
client_id = grafana
client_secret = $__file{/run/secrets/grafana-oauth/client-secret}
scopes = openid profile email
auth_url = https://sso.hkm.example/realms/hkm/protocol/openid-connect/auth
token_url = https://sso.hkm.example/realms/hkm/protocol/openid-connect/token
api_url = https://sso.hkm.example/realms/hkm/protocol/openid-connect/userinfo
login_attribute_path = preferred_username
email_attribute_path = email
use_pkce = true
use_refresh_token = true
# groups claim (flat) -> Grafana role
role_attribute_path = contains(groups[*], 'platform_admins') && 'Admin' || contains(groups[*], 'platform_operators') && 'Editor' || 'Viewer'
role_attribute_strict = false
allow_assign_grafana_admin = false
signout_redirect_url = https://sso.hkm.example/realms/hkm/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=https%3A%2F%2Fgrafana.hkm.example%2Flogin
