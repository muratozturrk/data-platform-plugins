# pyproject.toml

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "spark-prop-testing"
version     = "1.1.0"
description = "Property-based testing library for PySpark pipelines"
readme      = "README.md"
requires-python = ">=3.9"

dependencies = [
    "pyspark>=3.3.0",
    "hypothesis>=6.82.0",
    "returns>=0.22.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "rich>=13.0.0",       # beautiful terminal output
]

[project.optional-dependencies]
# Great Expectations layer (ExpectationSuiteBuilder, GEPropertyValidator,
# DataQualityPropertySuite): GX 1.x API, imported lazily.
ge = ["great-expectations>=1.3"]
dev = [
    "pytest>=7.4.0",
    "pytest-html>=4.0.0",
    "black",
    "mypy",
]

# ── Entry points ──────────────────────────────────────────────────────────────
[project.scripts]
spark-prop-test = "spark_prop_testing.cli:main"

# ── pytest plugin registration ────────────────────────────────────────────────
[project.entry-points."pytest11"]
spark_prop_testing = "spark_prop_testing.plugin"
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
