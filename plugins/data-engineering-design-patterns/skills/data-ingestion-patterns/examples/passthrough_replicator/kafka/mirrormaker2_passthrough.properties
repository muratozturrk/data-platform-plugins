# mirrormaker2_passthrough.properties
#
# MirrorMaker 2 config for passthrough replication:
# copies all messages from source Kafka cluster to target Kafka cluster.
# Zero transformation — messages land exactly as produced.
#
# Run:
#   connect-mirror-maker.sh mirrormaker2_passthrough.properties

# ── Cluster aliases ────────────────────────────────────────────────────────────
clusters = source, target

source.bootstrap.servers = source-kafka:9092
target.bootstrap.servers = target-kafka:9092

# ── Replication flow: source → target ─────────────────────────────────────────
source->target.enabled = true
source->target.topics  = orders_events, customers, product_catalog

# Replica topics get the same partition count as the source, so per-partition order is kept.
# Use 3 in real clusters; 1 only for a single-broker local setup.
source->target.replication.factor = 1

# ── Offset sync ───────────────────────────────────────────────────────────────
# Translates source offsets to target offsets so consumers on the target
# cluster can resume from the correct position after a failover.
source->target.sync.topic.configs.enabled    = true
source->target.sync.topic.acls.enabled       = false
source->target.emit.heartbeats.enabled       = true
source->target.emit.checkpoints.enabled      = true

# Sync consumer group offsets every 10 seconds
source->target.sync.group.offsets.enabled    = true
source->target.sync.group.offsets.interval.seconds = 10

# ── Passthrough: keep topic names ─────────────────────────────────────────────
# The DefaultReplicationPolicy renames topics to <source-alias>.<topic> (source.orders_events).
# IdentityReplicationPolicy (Kafka 3.0+) keeps the original names. It is a global setting, and with it
# MM2 cannot detect cycles, so never combine it with an active/active (target->source) flow.
# No SMTs are configured: records, keys, headers and timestamps are copied untouched.
replication.policy.class = org.apache.kafka.connect.mirror.IdentityReplicationPolicy

# ── Performance tuning ────────────────────────────────────────────────────────
tasks.max              = 4
replication.factor     = 1