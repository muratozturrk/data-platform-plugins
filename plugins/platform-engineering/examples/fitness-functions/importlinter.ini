[importlinter]
root_package = platform

[importlinter:contract:core-never-imports-plugins]
name = Core must not import plugin implementations or provider SDKs
type = forbidden
source_modules = platform.core
forbidden_modules =
    platform.plugins
    boto3
    google.cloud
    azure
    snowflake
    databricks
    psycopg2

[importlinter:contract:plugins-use-sdk-only]
name = Plugins may only import the public SDK
type = forbidden
source_modules = platform.plugins
forbidden_modules = platform.core
    platform._internal

[importlinter:contract:layers]
name = Layering
type = layers
layers =
    platform.api
    platform.core
    platform.sdk
