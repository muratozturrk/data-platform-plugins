# Equivalent Quarkus configuration (reference)
nessie.server.default-branch=main
nessie.version.store.type=JDBC
nessie.version.store.persist.jdbc.datasource=postgresql
quarkus.datasource.postgresql.jdbc.url=jdbc:postgresql://postgres-nessie.platform.svc:5432/nessie
quarkus.datasource.postgresql.username=${NESSIE_DB_USER}
quarkus.datasource.postgresql.password=${NESSIE_DB_PASSWORD}
quarkus.datasource.postgresql.jdbc.max-size=20

nessie.server.authentication.enabled=true
quarkus.oidc.auth-server-url=https://keycloak.platform.svc/realms/platform
quarkus.oidc.client-id=nessie
quarkus.oidc.credentials.secret=${NESSIE_OIDC_SECRET}
nessie.server.authorization.enabled=true
# rules: see authorization-rules.properties

nessie.catalog.default-warehouse=hkm-lake
nessie.catalog.warehouses.hkm-lake.location=s3://hkm-lake/
nessie.catalog.service.s3.default-options.region=hkm-dc1
nessie.catalog.service.s3.default-options.endpoint=https://objectscale.hkm.internal
nessie.catalog.service.s3.default-options.path-style-access=true
nessie.catalog.service.s3.default-options.request-signing-enabled=true
nessie.catalog.service.s3.default-options.access-key=urn:nessie-secret:quarkus:nessie-catalog-secrets.s3-access-key
nessie.catalog.service.s3.default-options.sts-endpoint=https://objectscale.hkm.internal/sts
nessie.catalog.service.s3.default-options.assume-role=arn:aws:iam::000000000000:role/nessie-lake-vending
nessie.catalog.service.s3.default-options.client-session-duration=PT1H
nessie-catalog-secrets.s3-access-key.name=${S3_LAKE_ACCESS_KEY}
nessie-catalog-secrets.s3-access-key.secret=${S3_LAKE_SECRET_KEY}

quarkus.otel.exporter.otlp.endpoint=http://otel-collector.platform.svc:4317
quarkus.log.console.json=true
quarkus.http.port=19120
quarkus.management.port=9000
