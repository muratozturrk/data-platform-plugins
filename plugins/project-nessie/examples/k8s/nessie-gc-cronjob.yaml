---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nessie-gc
  namespace: platform-nessie
  labels: { app.kubernetes.io/part-of: data-platform, app.kubernetes.io/component: nessie-gc }
spec:
  schedule: "15 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: gc
              image: ghcr.io/projectnessie/nessie-gc:0.108.3
              args:
                - gc
                - --uri=https://nessie.platform.svc/api/v2
                - --default-cutoff=P30D
                - --cutoff=main=P90D
                - --cutoff=wap-.*=PT1H
                - --cutoff=backfill-.*=P7D
                - --cutoff=exp-.*=P7D
                - --cutoff=rel-.*=NONE
                - --jdbc-url=jdbc:postgresql://postgres-nessie.platform.svc:5432/nessie_gc
                - --jdbc-user=$(GC_DB_USER)
                - --jdbc-password=$(GC_DB_PASSWORD)
                - --defer-deletes            # review live-set first; remove once trusted
              env:
                - { name: NESSIE_AUTH_TOKEN, valueFrom: { secretKeyRef: { name: nessie-gc-token, key: token } } }
                - { name: GC_DB_USER, valueFrom: { secretKeyRef: { name: nessie-gc-db, key: username } } }
                - { name: GC_DB_PASSWORD, valueFrom: { secretKeyRef: { name: nessie-gc-db, key: password } } }
                - { name: AWS_ENDPOINT_URL, value: https://objectscale.hkm.internal }
                - { name: AWS_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: nessie-gc-s3, key: access-key } } }
                - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: nessie-gc-s3, key: secret-key } } }
              resources: { requests: { cpu: 500m, memory: 1Gi }, limits: { cpu: "2", memory: 2Gi } }
