connector.name=iceberg
iceberg.catalog.type=nessie
iceberg.nessie-catalog.uri=https://nessie.platform.svc/api/v2
iceberg.nessie-catalog.ref=t-acme
iceberg.nessie-catalog.default-warehouse-dir=s3://hkm-lake/t-acme/
iceberg.nessie-catalog.authentication.type=BEARER
iceberg.nessie-catalog.authentication.token=${ENV:NESSIE_T_ACME_TOKEN}
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD
fs.native-s3.enabled=true
s3.endpoint=https://objectscale.hkm.internal
s3.region=hkm-dc1
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_T_ACME_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_T_ACME_SECRET_KEY}
