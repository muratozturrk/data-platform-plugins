# Deny by default. Roles come from Keycloak token claims; groups follow {client}_{institution}_{role}.
nessie.server.authorization.rules.admin=role=='platform_admins'
nessie.server.authorization.rules.control_plane=role=='svc-control-plane' && op in ['VIEW_REFERENCE','CREATE_REFERENCE','DELETE_REFERENCE','ASSIGN_REFERENCE_TO_HASH','LIST_COMMIT_LOG','READ_ENTRIES','READ_REPOSITORY_CONFIG','UPDATE_REPOSITORY_CONFIG']
nessie.server.authorization.rules.gc=role=='svc-nessie-gc' && op in ['VIEW_REFERENCE','LIST_COMMIT_LOG','READ_ENTRIES','READ_CONTENT_KEY','READ_ENTITY_VALUE','VIEW_REFLOG']
nessie.server.authorization.rules.inst_read=role.matches('^platform_t-[a-z0-9]+_(analyst|engineer|pii-reader)$') && ref.startsWith(role.substring(9, role.lastIndexOf('_'))) && op in ['VIEW_REFERENCE','LIST_COMMIT_LOG','READ_ENTRIES','READ_CONTENT_KEY','READ_ENTITY_VALUE']
nessie.server.authorization.rules.release_read=role.startsWith('platform_t-') && ref.startsWith('rel-') && op in ['VIEW_REFERENCE','READ_ENTRIES','READ_CONTENT_KEY','READ_ENTITY_VALUE']
nessie.server.authorization.rules.inst_write=role.matches('^platform_t-[a-z0-9]+_engineer$') && (ref.startsWith(role.substring(9, role.lastIndexOf('_'))) || ref.startsWith('wap-') || ref.startsWith('backfill-')) && op in ['COMMIT_CHANGE_AGAINST_REFERENCE','CREATE_ENTITY','UPDATE_ENTITY','DELETE_ENTITY','CREATE_REFERENCE','DELETE_REFERENCE']
nessie.server.authorization.rules.inst_sign=role.startsWith('platform_t-') && api.apiName=='Iceberg' && actions.exists(a, a=='CATALOG_S3_SIGN')
nessie.server.authorization.rules.promotion=role=='svc-promotion' && ref=='main' && op in ['VIEW_REFERENCE','COMMIT_CHANGE_AGAINST_REFERENCE','ASSIGN_REFERENCE_TO_HASH','CREATE_REFERENCE','LIST_COMMIT_LOG','READ_ENTRIES']
